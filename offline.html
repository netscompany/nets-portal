<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061E33">
  <meta name="description" content="Nets Business Core sin conexión. Reintente cuando vuelva la red.">
  <title>Sin conexión - Nets Business Core</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{display:grid;place-items:center;min-height:100vh;margin:0;background:#F4F7FB;font-family:'DM Sans',system-ui,sans-serif;padding:24px;text-align:center}
    .card{max-width:380px;background:#fff;border:1px solid #DDE3EE;border-radius:16px;padding:28px;box-shadow:0 8px 24px rgba(6,30,51,.08)}
    img{height:36px;margin-bottom:16px}
    h1{font-size:22px;color:#061E33;margin:0 0 8px}
    p{font-size:14px;color:#3D5166;line-height:1.45}
    button{margin-top:16px;background:linear-gradient(90deg,#F5A623,#D9472B);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;min-height:44px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.svg" alt="Nets Company" width="120" height="36">
    <h1>Nets Business Core</h1>
    <p>Sin conexión. Sus datos de demostración siguen disponibles al recuperar la red.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
