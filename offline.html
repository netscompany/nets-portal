<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A192F">
  <title>Sin conexión - Nets Company</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F7FB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(10, 25, 47, 0.08);
    }
    .logo {
      max-width: 140px;
      height: auto;
      margin-bottom: 2rem;
    }
    h1 {
      color: #0A192F;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: #3D5166;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #FFFFFF;
      background: linear-gradient(135deg, #F5A623 0%, #D9472B 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      opacity: 0.95;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="logo.svg" alt="Nets Company" class="logo">
    <h1>Sin conexión</h1>
    <p>Revisa tu internet e intenta de nuevo.</p>
    <button type="button" class="btn" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
